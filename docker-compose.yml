services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-swiftpay}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-swiftpay}
    ports: ["5432:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-swiftpay} -d ${POSTGRES_DB:-swiftpay}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  zookeeper:
    image: confluentinc/cp-zookeeper:7.5.0
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    healthcheck:
      test: ["CMD-SHELL", "echo ruok | nc -w 2 localhost 2181 | grep imok"]
      interval: 10s
      timeout: 5s
      retries: 12

  kafka:
    image: confluentinc/cp-kafka:7.5.0
    ports: ["9092:9092"]
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
    healthcheck:
      test: ["CMD-SHELL", "kafka-topics --bootstrap-server localhost:9092 --list"]
      interval: 10s
      timeout: 10s
      retries: 12
    depends_on:
      zookeeper: { condition: service_healthy }

  transaction-gateway:
    build: { context: ., dockerfile: transaction-gateway/Dockerfile }
    ports: ["3001:3001"]
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-swiftpay}
      DB_USER: ${POSTGRES_USER:-swiftpay}
      DB_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      DB_DRIVER: org.postgresql.Driver
      FLYWAY_ENABLED: "false"
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      REDIS_HOST: redis
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
      kafka: { condition: service_healthy }

  ledger-service:
    build: { context: ., dockerfile: ledger-service/Dockerfile }
    ports: ["3002:3002"]
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-swiftpay}
      DB_USER: ${POSTGRES_USER:-swiftpay}
      DB_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      DB_DRIVER: org.postgresql.Driver
      FLYWAY_ENABLED: "true"
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      REDIS_HOST: redis
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
      kafka: { condition: service_healthy }

  analytics-worker:
    build: { context: ., dockerfile: analytics-worker/Dockerfile }
    ports: ["3003:3003"]
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-swiftpay}
      DB_USER: ${POSTGRES_USER:-swiftpay}
      DB_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      DB_DRIVER: org.postgresql.Driver
      FLYWAY_ENABLED: "false"
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
    depends_on:
      postgres: { condition: service_healthy }
      kafka: { condition: service_healthy }