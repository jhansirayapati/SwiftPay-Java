apiVersion: v1
kind: Namespace
metadata: { name: swiftpay }
---
apiVersion: apps/v1
kind: Deployment
metadata: { name: transaction-gateway, namespace: swiftpay }
spec:
  replicas: 2
  selector: { matchLabels: { app: transaction-gateway } }
  template:
    metadata: { labels: { app: transaction-gateway } }
    spec:
      containers:
        - name: app
          image: swiftpayjava-transaction-gateway:latest
          imagePullPolicy: IfNotPresent
          ports: [{ containerPort: 3001 }]
          env:
            - { name: SERVER_PORT, value: "3001" }
            - { name: DB_URL, valueFrom: { configMapKeyRef: { name: swiftpay-config, key: DB_URL } } }
            - { name: DB_USER, valueFrom: { configMapKeyRef: { name: swiftpay-config, key: POSTGRES_USER } } }
            - { name: DB_PASSWORD, valueFrom: { secretKeyRef: { name: swiftpay-secrets, key: DB_PASSWORD } } }
            - { name: DB_DRIVER, value: org.postgresql.Driver }
            - { name: FLYWAY_ENABLED, value: "false" }
            - { name: KAFKA_BOOTSTRAP_SERVERS, valueFrom: { configMapKeyRef: { name: swiftpay-config, key: KAFKA_BOOTSTRAP_SERVERS } } }
            - { name: REDIS_HOST, valueFrom: { configMapKeyRef: { name: swiftpay-config, key: REDIS_HOST } } }
            - { name: REDIS_PORT, value: "6379" }
          livenessProbe: { httpGet: { path: /health, port: 3001 }, initialDelaySeconds: 30, periodSeconds: 10 }
          readinessProbe: { httpGet: { path: /health/readiness, port: 3001 }, initialDelaySeconds: 30, periodSeconds: 10 }
---
apiVersion: v1
kind: Service
metadata: { name: transaction-gateway, namespace: swiftpay }
spec:
  selector: { app: transaction-gateway }
  ports: [{ port: 3001, targetPort: 3001 }]