apiVersion: apps/v1
kind: Deployment
metadata:
  name: ledger-service
  namespace: swiftpay
spec:
  replicas: 1
  selector:
    matchLabels: { app: ledger-service }
  template:
    metadata: { labels: { app: ledger-service } }
    spec:
      containers:
        - name: ledger-service
          image: swiftpayjava-ledger-service:latest
          imagePullPolicy: IfNotPresent
          ports: [{ containerPort: 3002 }]
          env:
            - { name: SERVER_PORT, value: "3002" }
            - { name: DB_URL, valueFrom: { configMapKeyRef: { name: swiftpay-config, key: DB_URL } } }
            - { name: DB_USER, valueFrom: { configMapKeyRef: { name: swiftpay-config, key: POSTGRES_USER } } }
            - { name: DB_PASSWORD, valueFrom: { secretKeyRef: { name: swiftpay-secrets, key: DB_PASSWORD } } }
            - { name: DB_DRIVER, value: org.postgresql.Driver }
            - { name: FLYWAY_ENABLED, value: "true" }
            - { name: SPRING_FLYWAY_BASELINE_ON_MIGRATE, value: "true" }
            - { name: SPRING_FLYWAY_BASELINE_VERSION, value: "0" }
            - { name: KAFKA_BOOTSTRAP_SERVERS, valueFrom: { configMapKeyRef: { name: swiftpay-config, key: KAFKA_BOOTSTRAP_SERVERS } } }
            - { name: REDIS_HOST, valueFrom: { configMapKeyRef: { name: swiftpay-config, key: REDIS_HOST } } }
            - { name: REDIS_PORT, value: "6379" }
          livenessProbe: { httpGet: { path: /health, port: 3002 }, initialDelaySeconds: 30, periodSeconds: 10 }
          readinessProbe: { httpGet: { path: /health/readiness, port: 3002 }, initialDelaySeconds: 30, periodSeconds: 10 }
---
apiVersion: v1
kind: Service
metadata: { name: ledger-service, namespace: swiftpay }
spec:
  selector: { app: ledger-service }
  ports: [{ port: 3002, targetPort: 3002 }]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: analytics-worker
  namespace: swiftpay
spec:
  replicas: 1
  selector:
    matchLabels: { app: analytics-worker }
  template:
    metadata: { labels: { app: analytics-worker } }
    spec:
      containers:
        - name: analytics-worker
          image: swiftpayjava-analytics-worker:latest
          imagePullPolicy: IfNotPresent
          ports: [{ containerPort: 3003 }]
          env:
            - { name: SERVER_PORT, value: "3003" }
            - { name: DB_URL, valueFrom: { configMapKeyRef: { name: swiftpay-config, key: DB_URL } } }
            - { name: DB_USER, valueFrom: { configMapKeyRef: { name: swiftpay-config, key: POSTGRES_USER } } }
            - { name: DB_PASSWORD, valueFrom: { secretKeyRef: { name: swiftpay-secrets, key: DB_PASSWORD } } }
            - { name: DB_DRIVER, value: org.postgresql.Driver }
            - { name: FLYWAY_ENABLED, value: "false" }
            - { name: KAFKA_BOOTSTRAP_SERVERS, valueFrom: { configMapKeyRef: { name: swiftpay-config, key: KAFKA_BOOTSTRAP_SERVERS } } }
          livenessProbe: { httpGet: { path: /health, port: 3003 }, initialDelaySeconds: 30, periodSeconds: 10 }
          readinessProbe: { httpGet: { path: /health/readiness, port: 3003 }, initialDelaySeconds: 30, periodSeconds: 10 }
---
apiVersion: v1
kind: Service
metadata: { name: analytics-worker, namespace: swiftpay }
spec:
  selector: { app: analytics-worker }
  ports: [{ port: 3003, targetPort: 3003 }]
